<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Allocato – Smart Resource Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <header class="brand">
        <div class="logo">🏢 Allocato</div>
        <div class="tagline">Smart Resource Allocation System</div>
    </header>

    <main class="content">

        <section class="card">
            <h2>Book a Hall</h2>

            <div class="form-grid">
                <input id="userName" placeholder="Enter your name">

                <select id="resourceName">
                    <option value="">Select Hall</option>
                    <option value="Conference Hall">Conference Hall</option>
                    <option value="Meeting Room A">Meeting Room A</option>
                    <option value="Meeting Room B">Meeting Room B</option>
                    <option value="Seminar Hall">Seminar Hall</option>
                </select>

                <input id="startTime" type="datetime-local">
                <input id="endTime" type="datetime-local">
            </div>

            <!-- IMPORTANT: type="button" -->
            <button type="button" onclick="book()">Confirm Booking</button>
        </section>

        <section class="card">
            <h2>Current Bookings</h2>

            <table>
                <thead>
                    <tr>
                        <th>User Name</th>
                        <th>Hall</th>
                        <th>Start</th>
                        <th>End</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </section>

    </main>

    <footer>
        © 2026 Allocato organisation
    </footer>

</div>

<script src="script.js"></script>
</body>
</html>
